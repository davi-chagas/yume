<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YUME | Perfil</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/perfil.css">
    <link rel="icon" href="./assets/imgs/logo.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
</head>

<body onload="validarSessao(); getObsessions()">

    <div class="janela">

        <aside class="header-left">

            <img src="assets/imgs/logo.svg" width="100px" alt="Logo YUME">

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

            <div class="btn-nav-white">
                <a href="feed.html">
                    <h3>Feed</h3>
                </a>
            </div>

            <div class="btn-nav-white">
                <a href="dashboard/dashboard.html">
                    <h3>Métricas</h3>
                </a>
            </div>

            <div class="btn-nav-white">
                <a href="perfil.html">
                    <h3>Perfil</h3>
                </a>
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <a href="index.html">
                    <h3>Sair</h3>
                </a>
            </div>

        </aside>

        <main class="dash">

            <div class="header">
                <h1>Minhas Informações</h1>
            </div>

            <section class="perfil-container">
                <div class="info">
                    <div class="foto-perfil">
                        <img id="foto_usuario" alt="Foto de perfil">
                    </div>

                    <div class="campo-info">
                        <label>Nome</label>
                        <span id="nome_usuario"></span>
                    </div>

                    <div class="campo-info">
                        <label>Username</label>
                        <span id="username_usuario"></span>
                    </div>

                    <div class="campo-info">
                        <label>E-mail</label>
                        <span id="email_usuario"></span>
                    </div>

                    <a href="editar-perfil.html" class="btn-editar">Editar Perfil</a>

                </div>
            </section>

            <section class="obsessoes-container" id="obsessoes_container">
            </section>
        </main>
    </div>


</body>

</html>
<script>
    var nomeUsuario = sessionStorage.NAME_USER;
    var usernameUsuario = sessionStorage.USERNAME_USER;
    var emailUsuario = sessionStorage.EMAIL_USER;
    var fotoUsuario = sessionStorage.IMG_USER;
    var user_id = sessionStorage.ID_USUARIO;
    var avatarPadrao = 'assets/imgs/null.jpeg';

    document.getElementById('b_usuario').textContent = nomeUsuario;
    document.getElementById('nome_usuario').textContent = nomeUsuario;
    document.getElementById('username_usuario').textContent = usernameUsuario;
    document.getElementById('email_usuario').textContent = emailUsuario;
    document.getElementById('foto_usuario').src = fotoUsuario || avatarPadrao;

    function getObsessions() {
        var container = document.getElementById('obsessoes_container');

        var dadosObsessoes = [
            {
                titulo: 'Anime Favorito',
                nome: 'Não definido',
                imagem: avatarPadrao
            },
            {
                titulo: 'Assistindo Atualmente',
                nome: 'Não definido',
                imagem: avatarPadrao
            },
            {
                titulo: 'Personagem Favorito',
                nome: 'Não definido',
                imagem: avatarPadrao
            }
        ];

        fetch(`/obsessions/${user_id}`)
            .then(function (resposta) {
                console.log("resposta: ", resposta);

                if (resposta.ok) {
                    return resposta.json();
                } else {
                    throw "Houve um erro ao buscar as obsessões!";
                }
            })
            .then(function (obsessions) {
                if (obsessions.length > 0) {
                    var obsession = obsessions[0];

                    dadosObsessoes[0].nome = obsession.favorite_anime || 'Não definido';
                    dadosObsessoes[0].imagem = obsession.img_favorite_anime || avatarPadrao;

                    dadosObsessoes[1].nome = obsession.watching_now || 'Não definido';
                    dadosObsessoes[1].imagem = obsession.img_watching_now || avatarPadrao;

                    dadosObsessoes[2].nome = obsession.favorite_character || 'Não definido';
                    dadosObsessoes[2].imagem = obsession.img_favorite_character || avatarPadrao;
                }

                var header = document.createElement('div');
                header.className = 'obsessoes-header';

                var titulo = document.createElement('h2');
                titulo.textContent = 'Obsessões';

                var editar = document.createElement('a');
                editar.href = 'editar-obsessao.html';
                editar.className = 'btn-editar';
                editar.textContent = 'Editar';

                header.appendChild(titulo);
                header.appendChild(editar);

                var cards = document.createElement('div');
                cards.className = 'obsessoes-cards';

                for (let i = 0; i < dadosObsessoes.length; i++) {
                    var card = document.createElement('div');
                    card.className = 'obsessao-card';

                    var subtitulo = document.createElement('h3');
                    subtitulo.textContent = dadosObsessoes[i].titulo;

                    var imagem = document.createElement('img');
                    imagem.src = dadosObsessoes[i].imagem;
                    imagem.alt = dadosObsessoes[i].titulo;

                    var nome = document.createElement('p');
                    nome.textContent = dadosObsessoes[i].nome;

                    card.appendChild(subtitulo);
                    card.appendChild(imagem);
                    card.appendChild(nome);

                    cards.appendChild(card);
                }

                container.innerHTML = '';
                container.appendChild(header);
                container.appendChild(cards);
            })
            .catch(function (erro) {
                console.log(`#ERRO: ${erro}`);
            });
    }

    getObsessions();

</script>
