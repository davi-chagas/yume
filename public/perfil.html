<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YUME | Perfil</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/perfil.css">
    <link rel="icon" href="./assets/imgs/logo.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
</head>

<body onload="validarSessao(); updateObsession()">

    <div class="janela">

        <aside class="header-left">

            <img src="assets/imgs/logo.svg" width="100px" alt="Logo YUME">

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

            <div class="btn-nav-white">
                <a href="feed.html">
                    <h3>Feed</h3>
                </a>
            </div>

            <div class="btn-nav-white">
                <a href="dashboard/dashboard.html">
                    <h3>Métricas</h3>
                </a>
            </div>

            <div class="btn-nav-white">
                <a href="perfil.html">
                    <h3>Perfil</h3>
                </a>
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <a href="index.html">
                    <h3>Sair</h3>
                </a>
            </div>

        </aside>

        <main class="dash">

            <div class="header">
                <h1>Meu Perfil</h1>
            </div>

            <section class="perfil-container">

                <div class="foto-perfil">
                    <img id="foto_usuario" alt="Foto de perfil">
                </div>

                <div class="info">

                    <div class="campo-info">
                        <label>Nome</label>
                        <span id="nome_usuario"></span>
                    </div>

                    <div class="campo-info">
                        <label>Username</label>
                        <span id="username_usuario"></span>
                    </div>

                    <div class="campo-info">
                        <label>E-mail</label>
                        <span id="email_usuario"></span>
                    </div>

                    <a href="editar-perfil.html" class="btn-editar">
                        Editar Perfil
                    </a>

                </div>

                <div class="divisor"></div>

                <div class="medalhas">

                    <h3>Medalhas</h3>

                    <div class="medalha">
                        <span>🏅</span>
                        <p>Primeiro Post Publicado</p>
                    </div>

                    <div class="medalha">
                        <span>🏅</span>
                        <p>10 Publicações Realizadas</p>
                    </div>

                    <div class="medalha">
                        <span>🏅</span>
                        <p>Primeiro Comentário Recebido</p>
                    </div>

                </div>

            </section>

            <section class="obsessoes-container" id="obsessoes_container">

            </section>

        </main>

    </div>


</body>

</html>
<script>

    const nomeUsuario = sessionStorage.NAME_USER;
    const usernameUsuario = sessionStorage.USERNAME_USER;
    const emailUsuario = sessionStorage.EMAIL_USER;
    const fotoUsuario = sessionStorage.IMG_USER;
    const user_id = sessionStorage.ID_USUARIO;

    const avatarPadrao = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
                <rect width="200" height="200" rx="100" fill="#dce8f7"/>
                <circle cx="100" cy="72" r="37" fill="#54967a"/>
                <path d="M25 190c0-43 33-72 75-72s75 29 75 72" fill="#54967a"/>
            </svg>
        `);

    document.getElementById('b_usuario').textContent = nomeUsuario || 'usuário';
    document.getElementById('nome_usuario').textContent = nomeUsuario || 'Não informado';
    document.getElementById('username_usuario').textContent = usernameUsuario || 'Não informado';
    document.getElementById('email_usuario').textContent = emailUsuario || 'Não informado';
    document.getElementById('foto_usuario').src = fotoUsuario || avatarPadrao;

    async function updateObsession() {
        const container = document.getElementById('obsessoes_container');

        const dadosObsessoes = [
            {
                titulo: 'Anime Favorito',
                nome: 'Não definido',
                imagem: avatarPadrao
            },
            {
                titulo: 'Assistindo Atualmente',
                nome: 'Não definido',
                imagem: avatarPadrao
            },
            {
                titulo: 'Personagem Favorito',
                nome: 'Não definido',
                imagem: avatarPadrao
            }
        ];

        try {
            const response = await fetch(`/obsessions/${user_id}`);

            if (!response.ok) {
                throw new Error(`Erro HTTP: ${response.status}`);
            }

            const obsessions = await response.json();

            if (obsessions.length > 0) {
                const obsession = obsessions[0];

                dadosObsessoes[0].nome = obsession.favorite_anime || 'Não definido';
                dadosObsessoes[0].imagem = obsession.img_favorite_anime || avatarPadrao;

                dadosObsessoes[1].nome = obsession.watching_now || 'Não definido';
                dadosObsessoes[1].imagem = obsession.img_watching_now || avatarPadrao;

                dadosObsessoes[2].nome = obsession.favorite_character || 'Não definido';
                dadosObsessoes[2].imagem = obsession.img_favorite_character || avatarPadrao;
            }

        } catch (erro) {
            console.error('Erro ao carregar obsessões:', erro);
        }

        // Cria o cabeçalho da seção
        const header = document.createElement('div');
        header.className = 'obsessoes-header';

        const titulo = document.createElement('h2');
        titulo.textContent = 'Obsessões';

        const editar = document.createElement('a');
        editar.href = 'editar-obsessao.html';
        editar.className = 'btn-editar';
        editar.textContent = 'Editar';

        header.appendChild(titulo);
        header.appendChild(editar);

        // Cria o container dos cards
        const cards = document.createElement('div');
        cards.className = 'obsessoes-cards';

        // Percorre as três obsessões e cria seus respectivos cards
        dadosObsessoes.forEach(function (dados) {
            const card = document.createElement('div');
            card.className = 'obsessao-card';

            const subtitulo = document.createElement('h3');
            subtitulo.textContent = dados.titulo;

            const imagem = document.createElement('img');
            imagem.src = dados.imagem;
            imagem.alt = dados.titulo;

            const nome = document.createElement('p');
            nome.textContent = dados.nome;

            card.appendChild(subtitulo);
            card.appendChild(imagem);
            card.appendChild(nome);

            cards.appendChild(card);
        });

        container.innerHTML = '';
        container.appendChild(header);
        container.appendChild(cards);
    }

</script>
