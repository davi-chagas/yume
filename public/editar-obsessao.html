<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YUME | Editar Obsessões</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/editar-obsessao.css">
    <link rel="icon" href="./assets/imgs/logo.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="janela">

        <div class="header-left">

            <img src="assets/imgs/logo.svg" width="100px" alt="Logo YUME">

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

            <div class="btn-nav-white">
                <a href="feed.html">
                    <h3>Feed</h3>
                </a>
            </div>

            <div class="btn-nav-white">
                <a href="dashboard/dashboard.html">
                    <h3>Métricas</h3>
                </a>
            </div>

            <div class="btn-nav-white">
                <a href="perfil.html">
                    <h3>Perfil</h3>
                </a>
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <a href="index.html">
                    <h3>Sair</h3>
                </a>
            </div>
        </div>

        <div class="dash">

            <div class="header">
                <div>
                    <h1>Editar <span>Obsessões</span></h1>
                </div>
            </div>

            <form class="form-obsessoes" id="form_obsessoes" enctype="multipart/form-data">

                <section class="obsessao-section">

                    <div class="obsessao-titulo">
                        <h2>Anime Favorito</h2>
                        <span>01</span>
                    </div>

                    <div class="obsessao-conteudo">

                        <div class="campos">

                            <div class="campo">
                                <label for="ipt_favorite_anime">Nome do anime</label>
                                <input type="text" id="ipt_favorite_anime" name="favorite_anime"
                                    placeholder="Ex: Bleach">
                            </div>

                            <div class="campo">
                                <label for="ipt_img_favorite_anime">Imagem do anime</label>
                                <input type="file" id="ipt_img_favorite_anime" name="img_favorite_anime"
                                    accept="image/png, image/jpeg, image/webp">
                            </div>

                        </div>

                    </div>

                </section>

                <section class="obsessao-section">

                    <div class="obsessao-titulo">
                        <h2>Assistindo Atualmente</h2>
                        <span>02</span>
                    </div>

                    <div class="obsessao-conteudo">
                        <div class="campos">
                            <div class="campo">
                                <label for="ipt_watching_now">Nome do anime</label>
                                <input type="text" id="ipt_watching_now" name="watching_now" placeholder="Ex: Naruto">
                            </div>

                            <div class="campo">
                                <label for="ipt_img_watching_now">Imagem do anime</label>
                                <input type="file" id="ipt_img_watching_now" name="img_watching_now"
                                    accept="image/png, image/jpeg, image/webp">
                            </div>
                        </div>
                    </div>
                </section>

                <section class="obsessao-section">
                    <div class="obsessao-titulo">
                        <h2>Personagem Favorito</h2>
                        <span>03</span>
                    </div>

                    <div class="obsessao-conteudo">
                        <div class="campos">
                            <div class="campo">
                                <label for="ipt_favorite_character">Nome do personagem</label>
                                <input type="text" id="ipt_favorite_character" name="favorite_character"
                                    placeholder="Ex: Toshiro Hitsugaya">
                            </div>

                            <div class="campo">
                                <label for="ipt_img_favorite_character">Imagem do personagem</label>
                                <input type="file" id="ipt_img_favorite_character" name="img_favorite_character"
                                    accept="image/png, image/jpeg, image/webp">
                            </div>
                        </div>
                    </div>

                </section>

                <div class="acoes">
                    <button type="submit" class="btn-salvar">
                        Salvar Alterações
                    </button>

                </div>
            </form>
        </div>
    </div>

</body>

<script>

    document.getElementById('b_usuario').textContent = sessionStorage.NAME_USER;
    function updateObsessions() {
        var user_id = sessionStorage.ID_USUARIO;

        fetch(`/obsessions/${user_id}`)
            .then(function (resposta) {

                console.log("resposta: ", resposta);

                if (resposta.ok) {
                    return resposta.json();
                } else {
                    throw "Houve um erro ao buscar as obsessões!";
                }

            })
            .then(function (obsessions) {

                if (obsessions.length === 0) {
                    return;
                }

                var obsession = obsessions[0];

                ipt_favorite_anime.value = obsession.favorite_anime || '';
                ipt_watching_now.value = obsession.watching_now || '';
                ipt_favorite_character.value = obsession.favorite_character || '';

            })
            .catch(function (erro) {

                console.log(`#ERRO: ${erro}`);
                alert('Não foi possível carregar suas obsessões.');

            });
    }

    function saveObsessions(event) {
        event.preventDefault();

        var user_id = sessionStorage.ID_USUARIO;

        var favorite_anime = ipt_favorite_anime.value;
        var watching_now = ipt_watching_now.value;
        var favorite_character = ipt_favorite_character.value;

        if (
            favorite_anime.trim() == '' ||
            watching_now.trim() == '' ||
            favorite_character.trim() == ''
        ) {
            alert('Preencha todos os campos antes de salvar.');
            return false;
        }

        var formData = new FormData();

        formData.append('favorite_anime', favorite_anime);
        formData.append('watching_now', watching_now);
        formData.append('favorite_character', favorite_character);

        var img_favorite_anime = ipt_img_favorite_anime.files[0];
        var img_watching_now = ipt_img_watching_now.files[0];
        var img_favorite_character = ipt_img_favorite_character.files[0];

        if (img_favorite_anime) {
            formData.append('img_favorite_anime', img_favorite_anime);
        }

        if (img_watching_now) {
            formData.append('img_watching_now', img_watching_now);
        }

        if (img_favorite_character) {
            formData.append('img_favorite_character', img_favorite_character);
        }

        fetch(`/obsessions/${user_id}`, {
            method: 'PUT',
            body: formData
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);

                if (resposta.ok) {
                    alert('Obsessões atualizadas com sucesso!');

                    window.location = 'perfil.html';

                } else {
                    throw "Houve um erro ao atualizar as obsessões!";
                }

            })
            .catch(function (erro) {
                console.log(`#ERRO: ${erro}`);
                alert('Não foi possível salvar suas alterações.');

            });

        return false;
    }

    document.getElementById('form_obsessoes')
        .addEventListener('submit', saveObsessions);

    window.addEventListener('load', function () {

        validarSessao();
        updateObsessions();

    });
</script>

</html>
