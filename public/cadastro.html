<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>YUME | Cadastro</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="./css/cadastro.css" />
  <link rel="icon" href="./assets/imgs/logo.svg">
  <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body>
  <div class="header">
    <div class="container">
      <a href="index.html">
        <img src="assets/imgs/logo.svg" width="75px">
      </a>
      <ul class="navbar">
        <li>
          <a href="sobre.html">Sobre</a>
        </li>
        <li>
          <a href="cultura.html">Cultura</a>
        </li>
        <li>
          <a class="btn-cadastrar" href="login.html">Entrar</a>
        </li>
      </ul>
    </div>
  </div>

  <div class="container-login">
    <div class="div-foto">
      <img src="assets/imgs/login.png" alt="">
    </div>
    <div class="div-formulario">


      <div class="div-campos">
        <div class="alerta-erro">
          <div class="card-erro" id="cardErro">
            <span id="msg_error"></span>
          </div>
        </div>
        <div class="div-titulo">
          <h1>CADASTRE-SE</h1>
        </div>

        <label for="ipt_name" class="label-inputs">Nome</label><br>
        <input type="text" id="ipt_name" placeholder="Digite seu nome" class="ipt-info"> <br>

        <label for="ipt_username" class="label-inputs">Username</label><br>
        <input type="text" id="ipt_username" placeholder="@username" class="ipt-info"><br>

        <label for="ipt_email" class="label-inputs">E-mail</label><br>
        <input type="text" id="ipt_email" placeholder="nome@email.com" class="ipt-info"><br>

        <label for="ipt_password" class="label-inputs">Senha</label><br>
        <input type="password" id="ipt_password" onkeyup="mostrarSenha()" placeholder="Digite sua senha" required
          class="ipt-info"><br>

        <div id="div_password"></div>

        <label for="ipt_confirm_password" class="label-inputs">Confirmação Senha</label><br>
        <input type="password" id="ipt_confirm_password" onkeyup="mostrarSenha()" placeholder="Confirme sua senha"
          required class="ipt-info"><br>

        <div id="div_confirm_password"></div>

        <div class="alerta-success">
          <div class="card-success" id="cardSuccess">
            <span id="msg_success"></span>
          </div>
        </div>

        <button onclick="cadastrar()">Cadastrar</button>
        <tr></tr>
        <p class="p-entrar">Já possui uma conta? <a href="login.html">Entrar</a><br>
      </div>
    </div>
  </div>

  <!--footer inicio-->
  <div class="footer">
    <div class="container">
      <img src="assets/imgs/logo.svg" width="75px">
      <h4>Desenvolvido por Davi Chagas | SPTech &copy; 2026</h4>
    </div>
  </div>
  <!--footer fim-->
</body>

</html>

<script>

  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nameVar = ipt_name.value;
    var emailVar = ipt_email.value;
    var usernameVar = ipt_username.value;
    var passwordVar = ipt_password.value;
    var confirmacaoSenhaVar = ipt_confirm_password.value;

    // Verificando se há algum campo em branco
    if (
      nameVar == "" ||
      emailVar == "" ||
      passwordVar == "" ||
      usernameVar == '' ||
      confirmacaoSenhaVar == ""
    ) {
      cardErro.style.display = 'block';
      msg_error.innerHTML =
        "Todos os campos precisam ser preenchidos";

      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    if (nameVar.length < 1) {
      cardErro.style.display = 'block';
      msg_error.innerHTML =
        'Nome precisa ser maior que 1 caracter'
      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    if (!usernameVar.startsWith('@')) {
      cardErro.style.display = 'block';
      msg_error.innerHTML =
        'Username precisa começar com @'
      finalizarAguardar()
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    if (usernameVar.length > 15) {
      cardErro.style.display = 'block';
      msg_error.innerHTML =
        'Limite máximo de caracteres para username excedido (15)'
      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    if (!emailVar.includes('@') || !emailVar.includes('.')) {
      cardErro.style.display = 'block';
      msg_error.innerHTML =
        'Email deve incluir @ e .'
      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    if (passwordVar.length < 7) {
      cardErro.style.display = 'block';
      msg_error.innerHTML =
        'Senha precisa ser maior que 6 caracteres'
    } else {
      setInterval(sumirMensagem, 5000);
    }

    if (confirmacaoSenhaVar != passwordVar) {
      cardErro.style.display = 'block';
      msg_error.innerHTML =
        'As senhas não coincidem'
      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        nomeServer: nameVar,
        usernameServer: usernameVar,
        emailServer: emailVar,
        passwordServer: passwordVar,
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardSuccess.style.display = 'block';
          msg_success.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  function mostrarSenha() {
    let password = ipt_password.value.trim();
    let confirm_password = ipt_confirm_password.value.trim();
    let have_special = password.includes('!') || password.includes('@') || password.includes('#') || password.includes('$') || password.includes('.') || password.includes('*') || password.includes('-');
    let upper_password = password.toUpperCase();
    let lower_password = password.toLowerCase();
    let req = 0;

    if (password.length >= 8) {
      req++
    }

    if (password != upper_password) {
      req++
    }

    if (password != lower_password) {
      req++
    }

    if (have_special) {
      req++
    }

    if (req == 4) {
      div_password.innerHTML = `Senha <b style="color: green">Forte</b>`
    } else if (req == 3) {
      div_password.innerHTML = `Senha <b style="color: #FFD700">Média</b>`
    } else {
      div_password.innerHTML = `Senha <b style="color: red">Fraca</b>`
    }

    if (password != confirm_password) {
      div_confirm_password.innerHTML = `Senhas <b style="color:red">não coincidem</b>`
    } else {
      div_confirm_password.innerHTML = ``
    }
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
    cardSuccess.style.display = "none";
  }

</script>
