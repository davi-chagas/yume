<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YUME | Login</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/cadastro.css">
    <link rel="icon" href="./assets/imgs/logo.svg">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>

<body>
    <div class="header">
        <div class="container">
            <a href="index.html">
                <img src="assets/imgs/logo.svg" width="75px">
            </a>
            <ul class="navbar">
                <li>
                    <a href="sobre.html">Sobre</a>
                </li>
                <li>
                    <a href="cultura.html">Cultura</a>
                </li>
                <li>
                    <a class="btn-cadastrar" href="login.html">Entrar</a>
                </li>
            </ul>
        </div>
    </div>

    <div class="container-login">
        <div class="div-foto">
            <img src="assets/imgs/login.png" alt="">
        </div>
        <div class="div-formulario">
            <div class="div-campos">
                <div class="alerta-erro">
                    <div class="card-erro" id="cardErro">
                        <span id="msg_error"></span>
                    </div>
                </div>
                <div class="div-titulo">
                    <h1>ENTRE COM A SUA CONTA</h1>
                </div>

                <label for="ipt_email" class="label-inputs">E-mail</label><br>
                <input type="text" id="ipt_email" placeholder="email@exemplo.com" class="ipt-info"><br>

                <label for="ipt_password" class="label-inputs">Senha</label><br>
                <input type="password" id="ipt_password" placeholder="Digite sua senha" required class="ipt-info"><br>
                <div id="div_senha"></div>

                <div id="div_aguardar" class="loading-div">
                    <img src="assets/circle-loading.gif" id="loading-gif">
                </div>

                <div class="alerta-success">
                    <div class="card-success" id="cardSuccess">
                        <span id="msg_success"></span>
                    </div>
                </div>

                <button onclick="entrar()">Entrar</button>
                <tr></tr>
                <p class="p-entrar">Ainda não tem uma conta? <a href="cadastro.html">Cadastra-se</a><br>
            </div>
        </div>
    </div>

    <!--footer inicio-->
    <div class="footer">
        <div class="container">
            <img src="assets/imgs/logo.svg" width="75px">
            <h4>Desenvolvido por Davi Chagas | SPTech &copy; 2026</h4>
        </div>
    </div>
</body>

</html>

<script>
    function entrar() {
        aguardar();

        var emailVar = ipt_email.value;
        var passwordVar = ipt_password.value;

        if (emailVar == "" || passwordVar == "") {
            cardErro.style.display = "block"
            msg_error.innerHTML = "Todos os campos precisam ser preenchidos!";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", passwordVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                passwordServer: passwordVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USER = json.email;
                    sessionStorage.USERNAME_USER = json.username;
                    sessionStorage.NAME_USER = json.name;
                    sessionStorage.ID_USUARIO = json.id;

                    setTimeout(function () {
                        window.location = "feed.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none";
        cardSuccess.style.display = "none";
    }

</script>
