<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YUME | Novo Post</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/novo-post.css">
    <link rel="icon" href="./assets/imgs/logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>


<body>
    <div class="janela">

        <aside class="header-left">
            <img src="assets/imgs/logo.svg" width="100px" alt="Logo YUME">

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

            <div class="btn-nav-white">
                <a href="feed.html">
                    <h3>Feed</h3>
                </a>
            </div>

            <div class="btn-nav-white">
                <a href="dashboard/dashboard.html">
                    <h3>Métricas</h3>
                </a>
            </div>

            <div class="btn-nav-white">
                <a href="dashboard/dashboard.html">
                    <h3>Perfil</h3>
                </a>
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>
        </aside>

        <main class="dash">

            <div class="header">
                <h1>NOVO POST</h1>
            </div>

            <section class="novo-post-container">
                <form class="form-post" onsubmit="return newPost()" enctype="multipart/form-data">
                    <div class="card-erro" id="cardErr">
                        <div id="msg_error" class="msg-error"></div>
                    </div>
                    <div class="card-success" id="cardSuccess">
                        <div id="msg_success" class="msg-success"></div>
                    </div>

                    <div class="campo-post">
                        <label for="ipt_title">Título da publicação</label>
                        <input type="text" id="ipt_title" name="titulo" placeholder="Dê um título para sua publicação"
                            maxlength="100">
                    </div>

                    <div class="campo-post">
                        <label for="ipt_description">Descrição</label>
                        <textarea id="ipt_description" name="descricao"
                            placeholder="Compartilhe seus pensamentos com a comunidade..." rows="5"
                            maxlength="1000"></textarea>
                    </div>

                    <div class="campo-post">
                        <label for="ipt_img">Imagem da publicação</label>

                        <label for="ipt_img" class="upload-imagem">
                            <span class="upload-icone">+</span>
                            <span>Escolha uma imagem para o post</span>
                            <span class="upload-detalhe">PNG, JPG ou JPEG</span>
                        </label>

                        <input type="file" id="ipt_img" name="imagem" accept="image/png, image/jpeg">

                        <img id="preview_imagem" alt="Pré-visualização da imagem">
                    </div>

                    <div class="acoes-post">
                        <button type="submit" class="btn-publicar">
                            Publicar post
                        </button>
                    </div>

                </form>
            </section>

            <div id="alerta"></div>

        </main>
    </div>
</body>


</html>

<script>
    b_usuario.innerHTML = sessionStorage.NAME_USER;

    function newPost() {
        var titleVar = ipt_title.value;
        var descriptionVar = ipt_description.value;
        var userIdVar = sessionStorage.ID_USUARIO;
        var imgVar = ipt_img.files[0];

        msg_error.innerHTML = "";
        msg_success.innerHTML = "";

        if (titleVar == '') {
            cardErr.style.display = 'block';
            msg_error.innerHTML = 'Título precisa ser preenchido';
            return false;
        } else {
            setInterval(sumirMensagem, 5000)
        }

        if (descriptionVar == '') {
            cardErr.style.display = 'block';
            msg_error.innerHTML = 'Descrição precisa ser preenchida';
            return false;
        } else {
            setInterval(sumirMensagem, 5000)
        }

        var formData = new FormData();

        formData.append("title", titleVar);
        formData.append("description", descriptionVar);
        formData.append("user_id", userIdVar);

        if (imgVar) {
            formData.append("imagem", imgVar);
        }

        fetch(`/posts`, {
            method: 'POST',
            body: formData
        })
            .then(function (result) {
                if (result.ok) {
                    cardSuccess.style.display = 'block'
                    msg_success.innerHTML = 'Post registrado com sucesso!';
                    document.querySelector(".form-post").reset();

                    setTimeout(() => {
                        window.location = 'feed.html'
                    })
                } else {
                    throw new Error('Houve um erro ao tentar cadastrar o post.');
                }
            })
            .catch(function (erro) {
                console.log("ERRO:", erro);
                msg_error.innerHTML = 'Não foi possível cadastrar o post.';
            });

        return false;
    }

    function sumirMensagem() {
        cardErr.style.display = "none";
        cardSuccess.style.display = "none";
    }
</script>
