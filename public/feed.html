  </div>

<script>
  b_usuario.innerHTML = sessionStorage.NAME_USER;

  function atualizarFeed() {
    fetch("/posts")
      .then(function (resposta) {
        if (!resposta.ok) {
          throw new Error("Erro ao buscar os posts.");
        }

        return resposta.json();
      })
      .then(function (posts) {
        console.log("Posts recebidos:", posts);

        let feed = document.getElementById("post_container");

        feed.innerHTML = "";

        if (posts.length === 0) {
          feed.innerHTML = "<p>Nenhum post encontrado.</p>";
          return;
        }

        for (let i = 0; i < posts.length; i++) {

          let post = posts[i];

          let divPost = document.createElement("div");
          divPost.className = "post-box";

          let divHeader = document.createElement("div");

          let imgUsuario = document.createElement("img");
          imgUsuario.src = "assets/imgs/user.svg";
          imgUsuario.alt = "Foto do usuário";

          let spanUsuario = document.createElement("span");
          spanUsuario.textContent = post.username;

          let divTipo = document.createElement("div");

          let spanTipo = document.createElement("span");
          spanTipo.textContent = post.type;

          let pTitulo = document.createElement('h3');
          pTitulo.textContent = post.title;

          let pDescricao = document.createElement("p");
          pDescricao.textContent = post.description;

          let divImagens = document.createElement("div");
          divImagens.className = "post-images";

          if (post.img_url && post.img_url !== "null" && post.img_url !== "undefined") {
            let imgPost = document.createElement("img");

            imgPost.src = post.img_url;
            imgPost.alt = "Imagem da publicação";

            imgPost.style.cursor = "pointer";

            // Adiciona o evento de clique na imagem (gerado pelo IA)
            imgPost.addEventListener("click", function () {
              let modal = document.getElementById("modalImagem");
              let imagemAmpliada = document.getElementById("imagemAmpliada");

              imagemAmpliada.src = post.img_url;
              modal.style.display = "flex";
            });

            divImagens.appendChild(imgPost);
            divPost.appendChild(divImagens);
          }
          let divAcoes = document.createElement("div");
          divAcoes.className = "post-actions";

          // BOTÃO DE CURTIR

          let btnCurtir = document.createElement("img");
          btnCurtir.src = "assets/imgs/like.svg";
          btnCurtir.alt = "Curtir";

          // BOTÃO DE COMENTAR
          let btnComentar = document.createElement("img");
          btnComentar.src = "assets/imgs/comment.svg";
          btnComentar.alt = "Comentar";

          // MONTAGEM DO CABEÇALHO
          divTipo.appendChild(spanTipo);

          divHeader.appendChild(imgUsuario);
          divHeader.appendChild(spanUsuario);

          // MONTAGEM DAS AÇÕES
          divAcoes.appendChild(btnCurtir);
          divAcoes.appendChild(btnComentar);

          // MONTAGEM DO CARD
          divPost.appendChild(divHeader);
          divPost.appendChild(pTitulo)
          divPost.appendChild(pDescricao);
          divPost.appendChild(divImagens);
          divPost.appendChild(divAcoes);

          // INSERÇÃO NO FEED
          feed.appendChild(divPost);
        }
      })
      .catch(function (erro) {
        console.error("Erro:", erro);
      });
  }

  // Trecho gerado pela IA para clicar na imagem
  let modal = document.getElementById("modalImagem");
  let fecharModal = document.getElementById("fecharModal");

  fecharModal.addEventListener("click", function () {
    modal.style.display = "none";
  });

  modal.addEventListener("click", function (evento) {
    if (evento.target === modal) {
      modal.style.display = "none";
    }
  });

  document.addEventListener("keydown", function (evento) {
    if (evento.key === "Escape") {
      modal.style.display = "none";
    }
  });
</script>
